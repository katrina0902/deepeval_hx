# 大类：生成（所有生成类 AI 任务共享此配置）
# meta 含义与结构同 extraction.yaml

meta:
  test_case:
    required: [input, actual_output]        # input=案件材料/上下文，actual_output=生成文本
    optional: [expected_output, context, retrieval_context, name, tags]
  evaluate:
    identifier_prefix: "generation"
    async:                                   # 并发控制（限流或超时时调低）
      max_concurrent: 5                      # 最大并发数（默认 20）
      throttle_value: 2                      # 每次任务开始前等待秒数（默认 0）
    display:
      print_results: false
      truncate_passing_cases: true
    report:
      sync_to_cloud: false
      view_params: [input, actual_output, retrieval_context]
    error:
      ignore_errors: true
      skip_on_missing_params: true

# ---- 大类通用指标：生成文本的共性要求 ----
metrics:
  relevancy:
    metric: answer_relevancy
    name: "回答相关性"
    threshold: 0.8

  json_format:
    metric: json_correctness
    name: "JSON结构合规"
    threshold: 0.8