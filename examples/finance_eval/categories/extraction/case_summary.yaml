# 任务：案情概览（extraction/case_summary 与 extraction/case_overview_prod 共用）
# 运行：
#   python examples/finance_eval/run_eval.py --task extraction/case_summary          # 内置样例
#   python examples/finance_eval/run_eval.py --task extraction/case_overview_prod    # 生产数据 2026-09-10
# 指标 = 大类 extraction.yaml（摘要质量 + 事实忠实度）+ 本文件（JSON合规 + 相关性 + 4个自定义GEval）

# ---- 版本管理：评估标准（criteria/schema/阈值）迭代时改这里 ----
# template_version 会随每次运行记录进 test_run 的 hyperparameters，
# 用于区分"哪一版标准跑出的结果"；报告对比时按此归因。
meta:
  hyperparameters:
    template_version: "0903"
  # ---- 参数化 input 模板：{参数名} 引用 input_text JSON 内字段 ----
  # 可用字段：case_info / current_mediation_record /
  #           previous_communication_summary / existing_case_overview
  # （支持点路径，如 {case_info.subject_amount}）
  input_template: |
    任务：基于调解对话生成案件结构化摘要。
    调解对话素材：【见retrieval_context】
    上一轮案情概览：{existing_case_overview}
    历史调解记录压缩总结：{previous_communication_summary}
# ---- 业务 prompt 管理（被测系统给业务模型的提示词）----
# 文本维护在 examples/finance_eval/prompts/<任务名>/<版本名>.md（纯 prompt，文件名即版本名），
# 运行时自动取最新版本随 test_run 留档；
# 云端上传开关在环境变量 PROMPT_PUSH_TO_CLOUD=true（.env.local，需 Confident AI 付费计划）。

metrics:
  json_format:
    metric: json_correctness
    name: "JSON结构合规"
    threshold: 1
    # retrieval_context 置空（不配 output_field 即透传完整输出）
    # raw_input=true，则input为整个input_text原始JSON串
    # actual_output = 整个 ai_response_content（不配output_field）
    raw_input: true
    # 输出 JSON 的期望结构（每个 ai 任务不同，与本任务 GEval 同文件维护）
    schema:
      case_brief: str
      key_communication_facts:
        type: object
        fields:
          party_basic_information: str
          core_demands: str
          plan_feedback_and_commitments: str
          mediation_levers: str
          risk_items: str

  faithfulness:
    metric: faithfulness
    name: "事实忠实度"
    evaluation_params: [input, actual_output, retrieval_context]
    # retrieval_fields: [current_mediation_record.dialogue_text]
    retrieval_fields: [current_mediation_record.dialogue_text,case_info]
    threshold: 0.8

  # ---- 以下指标按需定制素材（retrieval_fields）与被评输出（output_field）----
  # retrieval_fields: input_text JSON 内哪些字段进 retrieval_context（素材块）
  # output_field:     ai_response_content JSON 内哪个子字段作为 actual_output（支持点路径）
  # input_template:   指标级 input 模板（可选，优先于上方 meta.input_template；
  #                   {参数名} 引用 input_text JSON 字段，未配置则用通用模板）
  # 未配置则透传原始 input / actual_output

# GEval 是论文原版 G-Eval 实现，**两步打分**：
# 1. Judge 先根据你写的`criteria`，生成一套分步评估标准（CoT 评估步骤）
# 2. 再用这套步骤对 case 打分（原始 1~5 分），利用 token 概率加权，归一化成 0~1；同时输出 reason 理由DeepEval。（logprob加权微调(非 strict模式,utils.py:337-383):取judge输出 score那个token的top候选概率分布，算期望分）

  commitment_chain:
    metric: geval
    name: "方案承诺完整度"
    criteria: "检查plan_feedback_and_commitments是否仅记录本轮最新商讨结果，不包含历史多轮承诺演变内容。评估项：1. 字段内仅保留当前对话产生的最新协商方案与履约承诺；2. 不得写入本轮之前的历史承诺、旧方案、过往变更记录；3. 是否编造对话不存在的承诺内容；4. 若输入材料中本轮不存在任何承诺，则该字段采用上一轮的plan_feedback_and_commitments或不输出任何内容，填入臆造内容为错误；5. 评估时先判断本轮是否产生新商讨结果，再评估内容合规性。"
    evaluation_params: [input, actual_output, retrieval_context]
    threshold: 0.8
    retrieval_fields: [current_mediation_record]
    output_field: key_communication_facts.plan_feedback_and_commitments

  lever_value:
    metric: geval
    name: "调解抓手博弈价值度"
    criteria: "评估mediation_levers提炼的调解抓手是否具有博弈价值：抓手应指向可实际施压或促成让步的信息（比如对方有还款意愿但缺能力，有能力还款但却还款意愿等），而非空泛表述（如'加强沟通'、'保持联系'）。有价值的抓手应说明其可运用方向；case_info信息本身不作为调解抓手；输入中无可用抓手时采用上一轮的mediation_levers或不输出任何内容。调解抓手不能是当事人明确提出的诉求、方案承诺；风险、轻生、投诉类信息不得写入调解抓手；已失效、已解决的抓手不应保留。"
    evaluation_params: [input, actual_output, retrieval_context]
    threshold: 0.7
    retrieval_fields: [case_info, current_mediation_record]
    output_field: key_communication_facts.mediation_levers

  compliance_risk_capture:
    metric: geval
    name: "高敏合规与客诉风险捕获率"
    criteria: "评估 risk_items 对高风险信号的捕获完整度。必查信号：被申请人/债务人情绪激烈/辱骂（客诉风险）；提及投诉/媒体/诉讼（升级风险）；泄露无关第三人信息（隐私合规）、被申请人要求索要工号、证件、单位地址；明确要求不再联系；反催收 / 债务规划师身份；拒绝协商因为历史投诉未处理。输入中存在但输出遗漏的信号计为漏捕；无中生有的风险项计为误报；在模型输出其他字段提及的信息不作为风险信号；长期逾期、申请人提出诉讼不作为风险信号；输入中无风险信号时模型实际输出完全置空。"
    evaluation_params: [input, actual_output, retrieval_context]
    threshold: 0.8
    retrieval_fields: [current_mediation_record.dialogue_text]
    output_field: key_communication_facts

  incremental_consistency:
    metric: geval
    name: "增量更新与上下文一致性"
    criteria: "仅评估新旧案情信息的合并与继承逻辑，**不校验信息是否来源于对话素材，信息真实性由faithfulness指标负责**。"
    evaluation_steps:
      - "1. 对比 existing_case_overview，检查历史关键有效信息是否无无故丢失、遗漏、篡改；"
      - "2. 仅需从dialogue_text提取新增内容，其他字段皆只用来辅助判断；且已经知晓案件基本信息（例如申请人、平台、阶段、纠纷类型、标的、逾期天数等），无需模型从输入中提取和新增。"
      - "3. 仅评估case_brief、key_communication_facts.party_basic_information、key_communication_facts.core_demands这三个位置。"
      - "4. 当新提取信息与历史案情信息发生冲突时，是否同时保留新旧两项信息并说明变化过程，禁止直接用新信息覆盖旧信息；"
      - "5. 不得将历史阶段未发生的事件描述为当前现状；"
      - "6. 检查模型是否正确叠加最新进展，不虚构历史状态、不篡改历史结论;"
      - "7. 本指标不校验本轮内容是否真实，仅校验多轮迭代更新逻辑正确性。"
    evaluation_params: [input, actual_output, retrieval_context]
    threshold: 0.8
    retrieval_fields: [current_mediation_record]

# 面向落地使用门槛，聚焦文本好不好读、能不能快速抓重点（重体验）
  mediator_usability:
    metric: geval
    name: "调解员使用友好度"
    criteria: "判断模型输出文本是否便于调解员直接阅读和现场使用，能不能辅助调解准备、减少整理案情的工作量，调解员长文本阅读能力有限。仅评估阅读易用性，不评估业务建议质量，不检查内容是否真实、有无法律错误。"
    evaluation_steps:
      - "1. 已经知晓案件基本信息（例如申请人、平台、阶段、纠纷类型、标的、逾期天数等），无需模型输出整合。"
      - "2. 仅评估文本阅读层面特性，不校验事实对错、案情信息提取质量、业务价值。"
      - "3. 语言是否通俗，避免晦涩专业术语、书面长难句。"
      - "4. 是否避免超大段密集文字，段落拆分合理，降低长文本阅读负担。"
      - "5. 结构清晰，重点信息分隔清楚，便于快速浏览。"
      - "6. 不存在冗余废话、无意义套话。"
      - "7. 综合判定：文本阅读门槛低，适合阅读能力有限的人员快速浏览。"
    evaluation_params: [input, actual_output, retrieval_context]
    threshold: 0.8
    retrieval_fields: [current_mediation_record]

  branch_compliance:
    metric: geval
    name: "分支越权更新"
    criteria: " 严格依据沟通类型与通话标签，校验本轮模型字段更新范围是否合规。区分四种分支权限：微信、有效通话、无效通话、未沟通。仅检查是否越权更新，不评估内容质量、价值、正确性。"
    evaluation_steps:
    - "1. 读取本轮 current_mediation_record 的 communication_type 与 call_tag，判定更新权限分支。"
    - "2. `communication_type` 为 `微信`：忽略 `call_tag`，可以更新全部字段，也可以不更新；"
    - "3. `communication_type` 为 `通话` 且 `call_tag` 为 `有效沟通`：可以更新全部字段，也可以不更新；"
    - "4. `communication_type` 为 `通话` 且 `call_tag` 为 `无效沟通` 或 `未沟通`：仅允许更新case_brief、mediation_levers、risk_items字段，也可以不更新；其他字段可进行描述上的优化，但实质内容不变;"
    - "5. 读取上一轮案情概览，对比本轮是否越权更新，字段顺序可能会有所变化；"
    - "6. 检出越权新增、越权删减、违规修改受限字段，判定为不合规。"
    evaluation_params: [input, actual_output, retrieval_context]
    threshold: 1
    retrieval_fields: [current_mediation_record]

